# ArtisanHub Farm: build the images and publish them to GHCR.
#
# Every push to main builds web, control-plane and router for amd64 and arm64
# and tags them sha-<short> and main. The ArtisanHub installer pins them by
# digest, so a new build changes nothing until the installer is moved to it.
# The web image is built for the path the hub serves it under, /apps/farm.
name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.name }} -> GHCR
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: web
            context: web
          - name: control-plane
            context: control-plane
          - name: router
            context: infra/router
    steps:
      - uses: actions/checkout@v4

      - id: meta
        run: echo "short=$(echo ${GITHUB_SHA} | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          build-args: |
            BASE_PATH=/apps/farm
            OPHQ_APP_COMMIT=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=AGPL-3.0-or-later
            org.opencontainers.image.title=artisan-hub-farm-${{ matrix.name }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/artisan-hub-farm-${{ matrix.name }}:main
            ghcr.io/${{ github.repository_owner }}/artisan-hub-farm-${{ matrix.name }}:sha-${{ steps.meta.outputs.short }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
